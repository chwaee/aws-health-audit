# Copy to config.yaml to override defaults. A missing config file is valid.
thresholds:
  idle_cpu_percent: 5
  idle_days: 7
  overprovisioned_cpu_percent: 20
  overprovisioned_memory_percent: 30
  overprovisioned_days: 14
  snapshot_age_days: 90
  access_key_max_age_days: 90
  access_key_high_age_days: 180
  unused_credential_days: 45
  root_use_days: 14
  s3_near_empty_bytes: 1048576
  lambda_memory_used_ratio: 0.5
  lambda_lookback_days: 14
  lambda_min_memory_mb: 256
  data_transfer_min_usd: 10
  waste_critical_usd: 500
  waste_high_usd: 100
  waste_medium_usd: 20
  min_metric_datapoints: 24
  eip_medium_count: 5

# Globs. Matching buckets raise the versioning finding from LOW to HIGH.
critical_buckets: []

# Resource ids or ARNs to omit from every check.
ignore_resources: []

# Empty means every opted-in region.
regions: []

max_workers: 8

checks:
  # Categories (cost, security, compliance, or the alias financial) or check ids.
  disabled: []
