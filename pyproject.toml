[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-health-audit"
version = "0.1.0"
description = "Read-only AWS account audit for cost, security, and CIS Foundations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chwaee", email = "hello@appliedaiconsulting.io" }]
keywords = ["aws", "audit", "security", "cost", "cis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "boto3>=1.35",
  "click>=8.1",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "moto>=5",
  "ruff>=0.6",
]

[project.scripts]
aws-health-audit = "aws_health_audit.cli:main"

[project.urls]
Homepage = "https://github.com/chwaee/aws-health-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
